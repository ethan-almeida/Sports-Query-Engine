<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sportsql</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f5f6f8; color: #1c2430; }
main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 1.4rem; margin: 0 0 4px; }
header p { margin: 0 0 20px; color: #5b6673; }
.card { background: #fff; border: 1px solid #dde3ea; border-radius: 10px; padding: 16px; font-size: .95rem; }
.card + .card { margin-top: 14px; }
label { display: block; font-weight: 600; margin-bottom: 6px; }
.ask-row { display: flex; gap: 8px; }
#question {
  flex: 1; padding: 10px 12px; font-size: .95rem; border: 1px solid #c6cfd9;
  border-radius: 8px; background: #fff; color: inherit;
}
#question:focus { outline: 2px solid #4a7dd6; outline-offset: 1px; }
button {
  padding: 10px 18px; font-size: .95rem; border: 0; border-radius: 8px;
  background: #2456b3; color: #fff; cursor: pointer;
}
button:disabled { opacity: .55; cursor: default; }
.status { margin: 12px 0 0; color: #5b6673; font-style: italic; }
#answer {
  white-space: normal; line-height: 1.5; margin: 0;
}
.badges { margin: 10px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
.badge {
  display: inline-block; padding: 2px 8px; font-size: .75rem; border-radius: 999px;
  border: 1px solid #c6cfd9; color: #5b6673;
}
.badge.cached { border-color: #2e8b57; color: #2e8b57; }
.asof { font-size: .8rem; color: #8a94a1; margin-top: 8px; }
summary { cursor: pointer; font-weight: 600; margin-bottom: 8px; }
.details { margin-top: 6px; }
pre {
  background: #0f1419; color: #dbe1e8; padding: 12px; border-radius: 8px;
  overflow-x: auto; font-size: .82rem;
}
pre.sql { margin: 0 0 12px; }
table { border-collapse: collapse; width: 100%; font-size: .8rem; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid #dde3ea; }
th { font-weight: 600; }
tbody tr:hover { background: #f0f3f7; }
@media (prefers-color-scheme: dark) {
  body { background: #14181d; color: #dbe1e8; }
  header p { color: #9aa6b4; }
  .card { background: #1c222a; border-color: #2b3540; }
  #question { background: #14181d; border-color: #2b3540; color: inherit; }
  th, td { border-bottom-color: #2b3540; }
  tbody tr:hover { background: #20272f; }
  .badge { border-color: #3a4654; color: #9aa6b4; }
  .asof { color: #6b7684; }
}
</style>
</head>
<body>
<main>
<header>
<h1>sportsql</h1>
<p>Ask a question about the NBA. Answers are SQL run against real box-score data.</p>
</header>

<div class="card">
  <label for="question">Question</label>
  <div class="ask-row">
    <input id="question" type="text" placeholder="Who attempted the most 3-pointers this season?" autocomplete="off">
    <button id="ask-btn" type="button">Ask</button>
  </div>
  <p id="status" class="status" hidden>Thinking…</p>
</div>

<div id="result-card" class="card" hidden>
  <p id="answer"></p>
  <div id="badges" class="badges"></div>
  <p id="asof" class="asof"></p>
  <details id="details" class="details">
    <summary>SQL &amp; rows</summary>
    <pre id="sql" class="sql"></pre>
    <div id="table-wrap"></div>
  </details>
</div>
</main>

<script>
(function () {
  // Wire up the ask form: on submit call /ask and render the response.
  const q = document.getElementById('question');
  const btn = document.getElementById('ask-btn');
  const status = document.getElementById('status');
  const card = document.getElementById('result-card');
  const answerEl = document.getElementById('answer');
  const badges = document.getElementById('badges');
  const asofEl = document.getElementById('asof');
  const details = document.getElementById('details');
  const sqlEl = document.getElementById('sql');
  const wrap = document.getElementById('table-wrap');

  function setBusy(busy) {
    btn.disabled = busy;
    q.disabled = busy;
    status.hidden = !busy;
    if (!busy) q.focus();
  }

  function clearResult() {
    answerEl.textContent = '';
    badges.textContent = '';
    asofEl.textContent = '';
    sqlEl.textContent = '';
    wrap.textContent = '';
    card.hidden = true;
    details.open = false;
  }

  // Build the rows <table> from the server's columns and rows arrays.
  function renderTable(columns, rows) {
    wrap.textContent = '';
    if (!columns || !rows || rows.length === 0) return;
    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    columns.forEach(function (c) {
      const th = document.createElement('th');
      th.textContent = c;
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    table.appendChild(thead);
    const tbody = document.createElement('tbody');
    rows.forEach(function (row) {
      const tr = document.createElement('tr');
      columns.forEach(function (_, i) {
        const td = document.createElement('td');
        td.textContent = row[i] == null ? '' : String(row[i]);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
  }

  async function ask() {
    const question = q.value.trim();
    if (!question) return;
    setBusy(true);
    clearResult();
    try {
      const resp = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: question })
      });
      let data = null;
      try { data = await resp.json(); } catch (e) { data = null; }
      if (!resp.ok) {
        answerEl.textContent = (data && data.error) || ('Request failed (HTTP ' + resp.status + ').');
        card.hidden = false;
        return;
      }
      answerEl.textContent = data.answer || 'No answer returned.';
      if (data.cached) {
        const b = document.createElement('span');
        b.className = 'badge cached';
        b.textContent = 'cached';
        badges.appendChild(b);
      }
      if (data.data_as_of) {
        asofEl.textContent = 'Data as of ' + data.data_as_of;
      }
      if (data.sql || (data.rows && data.rows.length)) {
        if (data.sql) sqlEl.textContent = data.sql;
        renderTable(data.columns, data.rows);
        details.hidden = false;
      }
      card.hidden = false;
    } catch (err) {
      answerEl.textContent = 'Could not reach the server: ' + err.message;
      card.hidden = false;
    } finally {
      setBusy(false);
    }
  }

  btn.addEventListener('click', ask);
  q.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') ask();
  });
  q.focus();
})();
</script>
</body>
</html>
